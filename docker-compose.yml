services:
  bot:
    build: .
    depends_on:
      db:
        condition: service_healthy
      redis:
        condition: service_started
    env_file:
      - .env
    ports:
      - "${HOST_WEB_PORT:-8000}:8000"
    restart: unless-stopped

  db:
    image: postgres:16
    environment:
      POSTGRES_DB: restaurant_bot
      POSTGRES_USER: postgres
      POSTGRES_PASSWORD: 2222
    ports:
      - "5432:5432"
    volumes:
      - postgres_data:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U postgres -d restaurant_bot"]
      interval: 5s
      timeout: 5s
      retries: 10

  redis:
    image: redis:7
    ports:
      - "6379:6379"
    restart: unless-stopped

volumes:
  postgres_data:
