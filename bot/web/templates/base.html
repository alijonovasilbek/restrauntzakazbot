<!doctype html>
<html lang="uz">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
  <meta name="theme-color" content="#43a047">
  <title>{% block title %}Bon Appétit{% endblock %}</title>
  <link rel="stylesheet" href="/static/app.css">
  <script src="https://telegram.org/js/telegram-web-app.js"></script>
  <style>
    body { background: #ffffff !important; }
  </style>
</head>
<body>
{% block body %}{% endblock %}

<script>
  // Initialize Telegram WebApp
  const tg = (window.Telegram && window.Telegram.WebApp) ? window.Telegram.WebApp : null;
  let cachedTelegramUser = null;
  if (tg) {
    tg.ready();
    tg.expand();
  }
  async function ensureTelegramUser(retries = 30, delayMs = 150) {
    for (let i = 0; i < retries; i += 1) {
      const currentUser = tg && tg.initDataUnsafe ? tg.initDataUnsafe.user : null;
      if (currentUser && currentUser.id) {
        cachedTelegramUser = currentUser;
        return currentUser;
      }
      await new Promise((resolve) => setTimeout(resolve, delayMs));
    }
    return cachedTelegramUser;
  }
  function tgUser() {
    if (cachedTelegramUser) return cachedTelegramUser;
    const currentUser = tg && tg.initDataUnsafe ? tg.initDataUnsafe.user : null;
    if (currentUser && currentUser.id) {
      cachedTelegramUser = currentUser;
      return currentUser;
    }
    return null;
  }
  function queryParam(name) {
    return new URLSearchParams(window.location.search).get(name) || '';
  }
  function getTelegramId() {
    const u = tgUser();
    return Number(u?.id || queryParam('tg_id') || 0);
  }
  function getFullName() {
    const u = tgUser();
    const firstName = u?.first_name || queryParam('full_name') || '';
    const lastName = u?.last_name || queryParam('last_name') || '';
    return `${firstName}${lastName ? ' ' + lastName : ''}`.trim() || 'Foydalanuvchi';
  }
  function getUsername() {
    const u = tgUser();
    return u?.username || queryParam('username') || '';
  }
  ensureTelegramUser();
</script>
{% block scripts %}{% endblock %}
</body>
</html>
