<!doctype html>
<html lang="uz">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
  <meta name="theme-color" content="#43a047">
  <title>{% block title %}Bon Appétit{% endblock %}</title>
  <link rel="stylesheet" href="/static/app.css">
  <script src="https://telegram.org/js/telegram-web-app.js"></script>
  <style>
    body { background: #ffffff !important; }
  </style>
</head>
<body>
{% block body %}{% endblock %}

<script>
  // Initialize Telegram WebApp
  const tg = (window.Telegram && window.Telegram.WebApp) ? window.Telegram.WebApp : null;
  if (tg) {
    tg.ready();
    tg.expand();
  }
  function tgUser() {
    return tg && tg.initDataUnsafe ? tg.initDataUnsafe.user : null;
  }
  function queryParam(name) {
    return new URLSearchParams(window.location.search).get(name) || '';
  }
  function getTelegramId() {
    const u = tgUser();
    return Number(u?.id || queryParam('tg_id') || 0);
  }
  function getFullName() {
    const u = tgUser();
    return `${u?.first_name || queryParam('full_name') || ''}${u?.last_name ? ' ' + u.last_name : ''}`.trim() || 'Foydalanuvchi';
  }
  function getUsername() {
    const u = tgUser();
    return u?.username || queryParam('username') || '';
  }
</script>
{% block scripts %}{% endblock %}
</body>
</html>
